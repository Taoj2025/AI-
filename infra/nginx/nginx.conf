# Nginx 反向代理配置 - ResumeAI 全栈
# 覆盖全部 7 个微服务 + API Gateway

upstream api_gateway {
    server api-gateway:3000;
}

upstream resume_service {
    server resume-service:3001;
}

upstream export_service {
    server export-service:3002;
}

upstream ai_dispatch {
    server ai-dispatch:3003;
}

upstream user_service {
    server user-service:3004;
}

upstream template_service {
    server template-service:3005;
}

upstream analytics_service {
    server analytics-service:3006;
}

upstream payment_service {
    server payment-service:3007;
}

# 全局 Gzip 压缩
gzip on;
gzip_types text/plain application/json application/javascript text/css text/xml application/xml;
gzip_min_length 1024;
gzip_vary on;

server {
    listen 80;
    server_name localhost;

    # 健康检查
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"resumeai-gateway","version":"1.0.0"}';
        add_header Content-Type application/json;
    }

    # ──────── API Gateway（统一入口）──────
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ──────── 用户服务（认证相关需直连）──────
    location /api/auth/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/users/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ──────── 简历服务 ────────
    location /api/resumes/ {
        proxy_pass http://resume_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ──────── 导出服务 ────────
    location /api/export/ {
        proxy_pass http://export_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # 导出可能较慢（尤其 PDF/PPT）
        client_max_body_size 10M;
    }

    # ──────── AI 调度服务 ────────
    location /api/generate {
        proxy_pass http://ai_dispatch;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;  # AI 生成可能较慢
    }

    location /api/ai/ {
        proxy_pass http://ai_dispatch;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # ──────── 模板服务 ────────
    location /api/templates/ {
        proxy_pass http://template_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ──────── 数据分析服务 ────────
    location /api/analytics/ {
        proxy_pass http://analytics_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # 统计查询可能较慢
    }

    # ──────── 支付服务 ────────
    location /api/payment/ {
        proxy_pass http://payment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/subscriptions/ {
        proxy_pass http://payment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 默认路由
    location / {
        return 200 '{"message":"ResumeAI API Gateway","version":"1.0.0","endpoints":["/api/auth","/api/users","/api/resumes","/api/export","/api/generate","/api/ai","/api/templates","/api/analytics","/api/payment","/api/subscriptions"]}';
        add_header Content-Type application/json;
    }
}
