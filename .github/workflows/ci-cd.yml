name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # Job 1: Python 服务测试
  # ============================================================
  test-python:
    name: Python Services Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ai-dispatch
          - export-service
          - template-service
          - analytics-service
          - payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-asyncio httpx python-multipart
      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          python -m pytest tests/ -v --tb=short --junitxml=results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/results.xml

  # ============================================================
  # Job 2: Node.js 服务测试
  # ============================================================
  test-node:
    name: Node.js Services Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - resume-service
          - user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          pnpm install --frozen-lockfile || pnpm install
      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          pnpm test

  # ============================================================
  # Job 3: Docker 构建与推送
  # ============================================================
  docker-build:
    name: Docker Build & Push
    needs: [test-python, test-node]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - { name: api-gateway, context: services/api-gateway, dockerfile: services/api-gateway/Dockerfile }
          - { name: ai-dispatch, context: services/ai-dispatch, dockerfile: services/ai-dispatch/Dockerfile }
          - { name: resume-service, context: services/resume-service, dockerfile: services/resume-service/Dockerfile }
          - { name: export-service, context: services/export-service, dockerfile: services/export-service/Dockerfile }
          - { name: user-service, context: services/user-service, dockerfile: services/user-service/Dockerfile }
          - { name: template-service, context: services/template-service, dockerfile: services/template-service/Dockerfile }
          - { name: analytics-service, context: services/analytics-service, dockerfile: services/analytics-service/Dockerfile }
          - { name: payment-service, context: services/payment-service, dockerfile: services/payment-service/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.context }}
          file: ./${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 4: 安全扫描
  # ============================================================
  security-scan:
    name: Security Scan
    needs: [test-python, test-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table'

  # ============================================================
  # Job 5: 部署到生产环境
  # ============================================================
  deploy:
    name: Deploy to Production
    needs: [docker-build, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes
        run: |
          echo "Deploying to K8s cluster..."
          # kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ github.repository }}/api-gateway:${{ github.sha }}
          # kubectl set image deployment/ai-dispatch ai-dispatch=${{ env.REGISTRY }}/${{ github.repository }}/ai-dispatch:${{ github.sha }}
          # kubectl set image deployment/resume-service resume-service=${{ env.REGISTRY }}/${{ github.repository }}/resume-service:${{ github.sha }}
          # kubectl set image deployment/export-service export-service=${{ env.REGISTRY }}/${{ github.repository }}/export-service:${{ github.sha }}
          # kubectl set image deployment/user-service user-service=${{ env.REGISTRY }}/${{ github.repository }}/user-service:${{ github.sha }}
          # kubectl set image deployment/template-service template-service=${{ env.REGISTRY }}/${{ github.repository }}/template-service:${{ github.sha }}
          # kubectl set image deployment/analytics-service analytics-service=${{ env.REGISTRY }}/${{ github.repository }}/analytics-service:${{ github.sha }}
          # kubectl set image deployment/payment-service payment-service=${{ env.REGISTRY }}/${{ github.repository }}/payment-service:${{ github.sha }}
          # kubectl rollout status deployment/api-gateway
          echo "Deployment complete!"
